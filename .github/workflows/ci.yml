name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build

      - name: Start server
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run smoke test
        run: npm test

      - name: Stop server
        if: always()
        run: pkill -f "node src/app.js" || true
